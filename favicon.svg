<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- a Formula car seen from above, nose up, on a dark tile so it reads on light and dark tabs -->
  <rect width="64" height="64" rx="14" fill="#1d1d1f"/>

  <!-- tyres -->
  <g fill="#f5f5f7">
    <rect x="12.5" y="15" width="9"  height="13" rx="3"/>
    <rect x="42.5" y="15" width="9"  height="13" rx="3"/>
    <rect x="10.5" y="37" width="11" height="15" rx="3.5"/>
    <rect x="42.5" y="37" width="11" height="15" rx="3.5"/>
  </g>

  <!-- wings, suspension arms, and the body -->
  <g fill="#ff453a">
    <rect x="15" y="7"  width="34" height="6" rx="2"/>
    <rect x="17" y="52.5" width="30" height="6" rx="2"/>
    <rect x="21" y="19.5" width="22" height="3"/>
    <rect x="21" y="43"   width="22" height="3"/>
    <path d="M29 10 h6 l2.2 15 l4.6 8.5 v12.5 l-4.8 8 h-10 l-4.8 -8 v-12.5 l4.6 -8.5 z"/>
  </g>

  <!-- cockpit and helmet -->
  <ellipse cx="32" cy="35.5" rx="4.4" ry="6.2" fill="#1d1d1f"/>
  <circle cx="32" cy="36.5" r="2.5" fill="#f5f5f7"/>
</svg>
