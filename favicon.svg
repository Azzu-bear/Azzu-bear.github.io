<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- a one-handed backhand at the finish: hitting arm high, off arm thrown back for balance,
       on hard-court blue. An original pictogram, not a likeness. -->
  <rect width="64" height="64" rx="14" fill="#0a7bdc"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs: wide stance, front knee bent into the shot -->
    <path d="M25 37 L34.5 45 L37 57" stroke-width="5.6"/>
    <path d="M25 37 L17.5 46.5 L9.5 56" stroke-width="5.6"/>
    <!-- torso, leaning into the follow-through -->
    <path d="M27.5 22.5 L25 37" stroke-width="7.6"/>
    <!-- off arm back, hitting arm up and through -->
    <path d="M26.5 23.5 L18.5 25.5 L11 31.5" stroke-width="4.4"/>
    <path d="M28.5 22.5 L36.5 20 L43.5 14.5" stroke-width="4.4"/>
    <!-- racket -->
    <path d="M43.5 14.5 L46.6 11.8" stroke-width="2.6"/>
    <ellipse cx="50.2" cy="8.7" rx="4.3" ry="5.9" transform="rotate(42 50.2 8.7)" stroke-width="2.3" fill="#ffffff" fill-opacity=".28"/>
  </g>

  <!-- head -->
  <circle cx="26.5" cy="13.5" r="5.2" fill="#ffffff"/>

  <!-- the ball, already on its way -->
  <circle cx="56" cy="25.5" r="3.1" fill="#d9f23c"/>
</svg>
