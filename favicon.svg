<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- a Formula car seen from above, nose up, in silver on a black tile -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e8e93"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>
  </defs>

  <!-- the hairline keeps the tile's edge visible on dark browser tabs -->
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.5" fill="#000000" stroke="#48484a" stroke-width="1.5"/>

  <!-- tyres -->
  <g fill="#636366">
    <rect x="12.5" y="15" width="9"  height="13" rx="3"/>
    <rect x="42.5" y="15" width="9"  height="13" rx="3"/>
    <rect x="10.5" y="37" width="11" height="15" rx="3.5"/>
    <rect x="42.5" y="37" width="11" height="15" rx="3.5"/>
  </g>

  <!-- wings, suspension arms, and the body -->
  <g fill="#c7c7cc">
    <rect x="15" y="7"  width="34" height="6" rx="2"/>
    <rect x="17" y="52.5" width="30" height="6" rx="2"/>
    <rect x="21" y="19.5" width="22" height="3"/>
    <rect x="21" y="43"   width="22" height="3"/>
  </g>
  <path fill="url(#silver)" d="M29 10 h6 l2.2 15 l4.6 8.5 v12.5 l-4.8 8 h-10 l-4.8 -8 v-12.5 l4.6 -8.5 z"/>

  <!-- cockpit and helmet -->
  <ellipse cx="32" cy="35.5" rx="4.4" ry="6.2" fill="#000000"/>
  <circle cx="32" cy="36.5" r="2.5" fill="#e5e5ea"/>
</svg>
