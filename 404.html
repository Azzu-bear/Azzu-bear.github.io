<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 &middot; Azam Mohamed</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d1117; --text: #c9d1d9; --dim: #8b949e;
    --faint: #6e7681; --green: #3fb950; --soil: #d29922; --blue: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 15px; line-height: 1.7;
    background-image: repeating-linear-gradient(
      to bottom, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  }
  main { padding: 32px; max-width: 46ch; }
  .prompt { color: var(--faint); margin-bottom: 18px; font-size: 13.5px; }
  .prompt b { color: var(--green); font-weight: 600; }
  .prompt i { color: var(--soil); font-style: normal; }
  h1 { font-size: 20px; margin: 0 0 10px; color: #e6edf3; }
  p { color: var(--dim); font-size: 14px; margin: 0 0 22px; }
  a { color: var(--blue); }
  .cursor {
    display: inline-block; width: .55em; height: 1em;
    background: var(--green); vertical-align: -.13em; margin-left: .15em;
    animation: blink 1.05s step-end infinite;
  }
  @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
</style>
</head>
<body>
  <main>
    <div class="prompt"><b>azam</b>@<i>santacruz</i>:~$ cat $REQUEST_URI</div>
    <h1>404: no such file or directory<span class="cursor"></span></h1>
    <p>
      The packet made it to the host, but there is nothing at this address.
      Somewhere upstream a link is stale.
    </p>
    <a href="/">&larr; back to the start</a>
  </main>
</body>
</html>
